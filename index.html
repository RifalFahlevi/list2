<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Sortir Buku Internal</title>
  
  <!-- Library Quagga2 (Spesialis Barcode Garis Merah 1D) -->
  <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>
  
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { padding: 20px; background-color: #f4f7f6; max-width: 750px; margin: auto; }
    h2 { color: #333; text-align: center; margin-bottom: 15px; }
    
    /* Navigasi Dashboard */
    .tab-nav { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 12px; background: #007bff; border: none; font-weight: bold; cursor: pointer; border-radius: 6px; color: white; transition: 0.2s; text-align: center; }
    .tab-btn.locked { background: #d6d6d6; color: #777; cursor: not-allowed; opacity: 0.8; }

    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .form-group { display: flex; flex-direction: column; gap: 12px; }
    .input-row { display: flex; gap: 10px; }
    input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    input[readonly] { background-color: #e9ecef; color: #495057; font-weight: bold; }
    .input-id { flex: 1; }
    .input-qty { width: 120px; text-align: center; font-weight: bold; }
    .input-stok { width: 120px; text-align: center; font-weight: bold; background-color: #fff3cd; color: #856404; border-color: #ffeeba; }
    
    button { background-color: #28a745; color: white; border: none; padding: 11px 20px; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; }
    button:hover { background-color: #218838; }
    button:disabled { background-color: #6c757d; cursor: not-allowed; }
    
    .btn-sync { background-color: #17a2b8; margin-bottom: 10px; width: 100%; }
    .btn-scan { background-color: #007bff; margin-bottom: 10px; width: 100%; display: flex; justify-content: center; align-items: center; gap: 8px; }
    .btn-scan:hover { background-color: #0056b3; }
    .btn-export { background-color: #ffc107; color: #212529; width: 100%; margin-top: 10px; font-weight: bold; }
    .btn-export:hover { background-color: #e0a800; }

    .status-msg { font-size: 13px; margin-top: -5px; font-weight: bold; }
    
    /* Box Ringkasan Stat */
    .stats-container { display: flex; gap: 10px; margin-bottom: 15px; }
    .stat-box { flex: 1; background: #e9f5ff; border: 1px solid #b6e0fe; padding: 10px; border-radius: 6px; text-align: center; }
    .stat-box h4 { margin: 0; font-size: 12px; color: #004085; }
    .stat-box p { margin: 5px 0 0 0; font-size: 18px; font-weight: bold; color: #007bff; }

    .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    select { padding: 8px; border-radius: 4px; border: 1px solid #ccc; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
    th, td { border: 1px solid #ddd; padding: 8px 10px; text-align: left; }
    th { background-color: #343a40; color: white; }
    tr:nth-child(even) { background-color: #f9f9f9; }
    
    /* Area Kamera Quagga */
    #reader-container { display: none; margin-bottom: 15px; border: 2px dashed #007bff; padding: 10px; border-radius: 8px; background: #fff; text-align: center; position: relative; }
    #interactive.viewport { width: 100%; height: 260px; overflow: hidden; position: relative; border-radius: 6px; }
    #interactive.viewport canvas, #interactive.viewport video { width: 100%; height: 100%; object-fit: cover; }
    
    /* Garis Laser Merah Presisi */
    .scan-guide {
      position: absolute;
      top: 50%;
      left: 10%;
      right: 10%;
      height: 2px;
      background: red;
      box-shadow: 0 0 10px red;
      z-index: 10;
      pointer-events: none;
    }
    .scan-box-info { font-size: 12px; color: #555; margin-top: 8px; line-height: 1.4; }
  </style>
</head>
<body>

  <h2>nyortir dulu kawann</h2>

  <!-- Navigasi Dashboard (External Dikunci) -->
  <div class="tab-nav">
    <div class="tab-btn">SORTIR INTERNAL</div>
    <div class="tab-btn locked" title="Dashboard External Belum Digunakan" onclick="alert('Dashboard External saat ini masih dikunci/belum digunakan.')">🔒 SORTIR EXTERNAL (LOCKED)</div>
  </div>

  <!-- Area Kamera -->
  <div class="card" style="padding: 10px; margin-bottom: 10px;">
    <button type="button" class="btn-sync" onclick="fetchData(true)">Sync Master Data Terbaru</button>
    <button type="button" class="btn-scan" onclick="toggleScanner()"><span id="btnScanText">Scan Barcode</span></button>
    
    <div id="reader-container">
      <div id="interactive" class="viewport">
        <div class="scan-guide"></div>
      </div>
      <p class="scan-box-info" id="scannerHint">Posisikan garis barcode melintasi <b>garis merah</b></p>
    </div>
  </div>

  <!-- ================= DASHBOARD SORTIR INTERNAL ================= -->
  <div id="tab1">
    <div class="card">
      <h3>Sortir Internal</h3>
      
      <!-- Ringkasan Statistik -->
      <div class="stats-container">
        <div class="stat-box">
          <h4>Total Jenis Buku Disimpan</h4>
          <p id="totalJenis1">0</p>
        </div>
        <div class="stat-box">
          <h4>Total Qty Fisik Disimpan</h4>
          <p id="totalQty1">0</p>
        </div>
      </div>

      <form id="bookForm1" class="form-group">
        <div class="input-row">
          <input type="text" id="inputId1" class="input-id" placeholder="Ketik/Scan ID Buku" required oninput="cariJudulOtomatis()" autofocus>
          <input type="text" id="inputStok1" class="input-stok" placeholder="Bisa Diambil" readonly title="Batas Stok yang Bisa Diambil">
        </div>
        <input type="text" id="inputJudul1" placeholder="Judul Buku (Otomatis)" readonly style="width: 100%;">
        
        <div class="input-row" style="align-items: center; justify-content: space-between;">
          <label style="font-size: 13px; font-weight: bold;">Qty Fisik Ditemukan:</label>
          <input type="number" id="inputQtyFisik1" class="input-qty" value="1" min="1" placeholder="Qty Fisik" required oninput="validasiQtyOver()">
        </div>

        <div id="statusMsg1" class="status-msg"></div>
        <button type="submit" id="btnSimpan1" disabled>Simpan Ke Internal</button>
      </form>
    </div>

    <div class="card">
      <div class="controls">
        <label><strong>Log Sortir Internal:</strong></label>
        <select id="sortBy1" onchange="renderTable1()">
          <option value="id-desc">Terbaru Disimpan</option>
          <option value="qty-desc">Qty Fisik Banyak ke Sedikit</option>
          <option value="judul-asc">Judul (A - Z)</option>
        </select>
      </div>

      <table>
        <thead>
          <tr>
            <th style="width: 25%;">ID Buku</th>
            <th>Judul Buku</th>
            <th style="width: 20%; text-align: center;">Qty Fisik</th>
          </tr>
        </thead>
        <tbody id="bookTableBody1">
          <tr><td colspan="3" style="text-align:center;">Memuat data...</td></tr>
        </tbody>
      </table>
      <button class="btn-export" onclick="exportToCSV()">📥 Tarik Log Internal (CSV/Excel)</button>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxX0EUjlxkRZ9_7buD0Ixvs2zovtAuR5gmMmL5xsv-uPptjiAX8VJ04RW0_dpa4b-s6Vw/exec";

    let masterMapInt = new Map(); // Map: id -> {judul, stok}
    let listBukuSimpan1 = [];
    let isScanning = false;

    document.addEventListener("DOMContentLoaded", () => {
      loadLocalMaster();
      fetchData(false);
    });

    function loadLocalMaster() {
      const cachedInt = localStorage.getItem("masterIntCache");
      if (cachedInt) {
        const arr = JSON.parse(cachedInt);
        masterMapInt = new Map(arr.map(item => [cleanID(item.id), { judul: item.judul, stok: item.stok || 0 }]));
      }
    }

    function cleanID(idStr) {
      if (!idStr) return "";
      return String(idStr).replace(/[^a-zA-Z0-9]/g, "").toUpperCase();
    }

    function fetchData(forceReload = false) {
      const statusMsg = document.getElementById("statusMsg1");
      if (forceReload && statusMsg) statusMsg.textContent = "Sedang sinkronisasi data master...";

      fetch(SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
          if (data.masterInternal) {
            localStorage.setItem("masterIntCache", JSON.stringify(data.masterInternal));
            masterMapInt = new Map(data.masterInternal.map(item => [cleanID(item.id), { judul: item.judul, stok: item.stok || 0 }]));
          }
          
          listBukuSimpan1 = data.simpanInternal || [];
          renderTable1();

          if (forceReload && statusMsg) {
            statusMsg.style.color = "#28a745";
            statusMsg.textContent = "✓ Master data berhasil diperbarui!";
            setTimeout(() => statusMsg.textContent = "", 2000);
          }
        })
        .catch(err => console.error("Error load data:", err));
    }

    // --- ENGINE SCANNER QUAGGA2 GARIS MERAH (UPGRADED) ---
    function toggleScanner() {
      const container = document.getElementById("reader-container");
      const btnText = document.getElementById("btnScanText");

      if (isScanning) {
        stopQuagga();
        container.style.display = "none";
        btnText.textContent = "Buka Kamera Scan Barcode";
        isScanning = false;
      } else {
        container.style.display = "block";
        btnText.textContent = "Tutup Kamera";
        isScanning = true;
        startQuaggaSmooth();
      }
    }

    function stopQuagga() {
      try { Quagga.stop(); } catch(e) {}
    }

    function startQuaggaSmooth() {
      Quagga.init({
        inputStream: {
          name: "Live",
          type: "LiveStream",
          target: document.querySelector("#interactive"),
          constraints: {
            facingMode: "environment",
            width: { min: 640, ideal: 1280 },
            height: { min: 480, ideal: 720 },
            aspectRatio: { ideal: 1.777777778 }
          },
          // Fokus membaca tepat pada area garis merah
          area: { top: "25%", right: "10%", left: "10%", bottom: "25%" }
        },
        locator: { patchSize: "medium", halfSample: false },
        numOfWorkers: 4,
        frequency: 12,
        decoder: { readers: ["code_128_reader", "ean_reader", "ean_8_reader", "code_39_reader"] },
        locate: true
      }, function(err) {
        if (err) { alert("Gagal membuka kamera: " + err); toggleScanner(); return; }

        const videoElem = document.querySelector("#interactive video");
        if (videoElem) {
          videoElem.setAttribute("playsinline", "true");
          videoElem.setAttribute("muted", "true");
          videoElem.play().catch(e => console.log(e));
        }

        Quagga.start();
      });

      Quagga.onDetected(onBarcodeDetected);
    }

    let codeBuffer = [];
    
    function onBarcodeDetected(result) {
      const rawCode = result.codeResult.code ? String(result.codeResult.code).trim() : "";
      const cleanedCode = cleanID(rawCode);

      if (!cleanedCode) return;

      const hint = document.getElementById("scannerHint");

      // Pencocokan ke Master Database Internal
      if (masterMapInt.has(cleanedCode)) {
        codeBuffer.push(cleanedCode);
        if (codeBuffer.length > 2) codeBuffer.shift();

        // Multi-frame verification: Wajib konsisten 2 kali baca berturut-turut
        if (codeBuffer.length === 2 && codeBuffer[0] === codeBuffer[1]) {
          codeBuffer = [];
          document.getElementById("inputId1").value = rawCode;
          cariJudulOtomatis();
          toggleScanner();
        } else {
          hint.style.color = "#28a745";
          hint.innerHTML = `⏳ <b>Buku terdeteksi!</b> Tahan HP sebentar...`;
        }
      } else {
        codeBuffer = [];
        hint.style.color = "#dc3545";
        hint.innerHTML = `✕ Barcode <b>${rawCode}</b> tidak ada di Master Internal!`;
      }
    }

    // PENCARIAN OTOMATIS & INTEGRASI STOK
    function cariJudulOtomatis() {
      const rawInput = document.getElementById("inputId1").value.trim();
      const cleanedInput = cleanID(rawInput);
      const btnSimpan = document.getElementById("btnSimpan1");
      const statusMsg = document.getElementById("statusMsg1");
      const inputJudul = document.getElementById("inputJudul1");
      const inputStok = document.getElementById("inputStok1");

      if (cleanedInput === "") {
        inputJudul.value = "";
        inputStok.value = "";
        statusMsg.textContent = "";
        btnSimpan.disabled = true;
        return;
      }

      if (masterMapInt.has(cleanedInput)) {
        const item = masterMapInt.get(cleanedInput);
        inputJudul.value = item.judul;
        inputStok.value = `Bisa: ${item.stok}`;
        
        statusMsg.style.color = "#28a745";
        statusMsg.textContent = `✓ Buku ditemukan! Maksimal stok bisa diambil: ${item.stok} pcs`;
        btnSimpan.disabled = false;
        
        validasiQtyOver();
      } else {
        inputJudul.value = "";
        inputStok.value = "";
        statusMsg.style.color = "#dc3545";
        statusMsg.textContent = "✕ ID tidak ada di Master Internal";
        btnSimpan.disabled = true;
      }
    }

    // VALIDASI PERINGATAN BILA QTY FISIK > STOK BISA DIAMBIL
    function validasiQtyOver() {
      const rawInput = document.getElementById("inputId1").value.trim();
      const cleanedInput = cleanID(rawInput);
      const qtyInput = parseInt(document.getElementById("inputQtyFisik1").value) || 0;
      const statusMsg = document.getElementById("statusMsg1");

      if (masterMapInt.has(cleanedInput)) {
        const stokMaks = masterMapInt.get(cleanedInput).stok;
        if (qtyInput > stokMaks) {
          statusMsg.style.color = "#d9534f";
          statusMsg.textContent = `⚠️ Peringatan: Qty fisik (${qtyInput}) melebihi stok yang bisa diambil (${stokMaks})!`;
        } else {
          statusMsg.style.color = "#28a745";
          statusMsg.textContent = `✓ Buku ditemukan! Maksimal stok bisa diambil: ${stokMaks} pcs`;
        }
      }
    }

    // SUBMIT SIMPAN INTERNAL
    document.getElementById("bookForm1").addEventListener("submit", function(e) {
      e.preventDefault();
      
      const idVal = document.getElementById("inputId1").value.trim();
      const cleanedId = cleanID(idVal);
      const judulVal = document.getElementById("inputJudul1").value;
      const qtyFisikVal = parseInt(document.getElementById("inputQtyFisik1").value) || 1;

      const dataBaru = { id: idVal, judul: judulVal, qty: qtyFisikVal, mode: "internal" };

      // Akumulasi pada log tabel lokal
      const indexExisting = listBukuSimpan1.findIndex(item => cleanID(item.id) === cleanedId);
      if (indexExisting !== -1) {
        listBukuSimpan1[indexExisting].qty += qtyFisikVal;
      } else {
        listBukuSimpan1.unshift(dataBaru);
      }

      renderTable1();

      // Reset Form
      document.getElementById("inputId1").value = "";
      document.getElementById("inputJudul1").value = "";
      document.getElementById("inputStok1").value = "";
      document.getElementById("inputQtyFisik1").value = "1";
      document.getElementById("statusMsg1").textContent = "";
      document.getElementById("btnSimpan1").disabled = true;
      document.getElementById("inputId1").focus();

      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(dataBaru)
      }).catch(err => console.error(err));
    });

    function renderTable1() {
      const sortBy = document.getElementById("sortBy1").value;
      const tbody = document.getElementById("bookTableBody1");

      let sortedData = [...listBukuSimpan1];

      sortedData.sort((a, b) => {
        if (sortBy === "judul-asc") return String(a.judul).localeCompare(String(b.judul));
        if (sortBy === "qty-desc") return b.qty - a.qty;
        if (sortBy === "id-desc") return 0;
      });

      document.getElementById("totalJenis1").textContent = sortedData.length;
      document.getElementById("totalQty1").textContent = sortedData.reduce((acc, curr) => acc + curr.qty, 0);

      tbody.innerHTML = "";
      if (sortedData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">Belum ada data Internal.</td></tr>';
        return;
      }

      sortedData.forEach(book => {
        tbody.innerHTML += `
          <tr>
            <td><code>${book.id}</code></td>
            <td><strong>${book.judul}</strong></td>
            <td style="text-align: center;"><span style="background:#007bff; color:white; padding:2px 8px; border-radius:10px; font-weight:bold;">${book.qty}</span></td>
          </tr>
        `;
      });
    }

    // EXPORT DATA LOG KE CSV / EXCEL
    function exportToCSV() {
      if (listBukuSimpan1.length === 0) return alert("Data log Internal masih kosong!");
      let csvContent = "data:text/csv;charset=utf-8,ID Buku,Judul Buku,Qty Fisik\n";
      listBukuSimpan1.forEach(row => {
        csvContent += `"${row.id}","${row.judul}","${row.qty}"\n`;
      });
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `Log_Sortir_Internal_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
